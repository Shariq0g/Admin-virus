<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskara Mini Clicker</title>

    <!-- REQUIRED: Taskara SDK -->
    <script src="https://taskara.com/sdk/v1.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-top: 20px;
            border: 3px solid #ffd700;
            box-shadow: 0 0 20px #ffd700;
        }

        #username, #userid {
            margin-top: 10px;
            font-size: 18px;
            opacity: 0.85;
        }

        #score {
            margin-top: 25px;
            font-size: 60px;
            font-weight: bold;
            background: linear-gradient(90deg, #ffcf33, #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #tapBtn {
            margin-top: 30px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle, #ffe066, #ff9900);
            box-shadow: 0 0 25px #ffcc00;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }

        #tapBtn:active {
            transform: scale(0.90);
        }

        #warn {
            margin-top: 40px;
            font-size: 12px;
            color: #ff4444;
            opacity: 0.75;
        }
    </style>
</head>

<body>

    <h1>Taskara Clicker</h1>

    <img id="avatar" src="" alt="avatar">

    <div id="username">Loading...</div>
    <div id="userid"></div>

    <h1 id="score">0</h1>

    <button id="tapBtn">TAP</button>

    <p id="warn">
        ⚠️ If suspicious activity is detected, your account, IP, and device may be permanently banned.
    </p>

    <script>
        let score = 0;

        // Initialize SDK
        Taskara.init({
            appId: "tkr_live_t6093re2_mk9l8wbd"
            callback: "https://yourapp.com"
        });

        // Load user
        async function loadUser() {
            try {
                const user = await Taskara.getUser();
                document.getElementById("username").innerText = "@" + user.username;
                document.getElementById("userid").innerText = "User ID: " + user.userId;
                document.getElementById("avatar").src = user.avatar;
            } catch (err) {
                console.error(err);
                alert("Unable to verify Taskara identity.");
            }
        }
        loadUser();

        // Click action
        document.getElementById("tapBtn").addEventListener("click", () => {
            score++;
            document.getElementById("score").innerText = score;

            // Send to Taskara
            Taskara.completeTask({
                taskId: "clicker_01",
                points: 1
            });
        });
    </script>

</body>
</html>

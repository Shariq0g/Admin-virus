<!DOCTYPE html>
<html>
<head>
  <title>Bitcoin Clicker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #0a0a0a;
      color: #f5f5f5;
    }

    h1 { margin-top: 40px; }

    #btc {
      font-size: 32px;
      margin: 20px 0;
    }

    #clickBtn {
      background: gold;
      border: none;
      padding: 20px 40px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }

    #clickBtn:active {
      transform: scale(0.95);
    }

    .upgrade {
      margin-top: 20px;
      background: #222;
      padding: 15px;
      border-radius: 10px;
      max-width: 300px;
      margin: 20px auto;
    }

    button.upgradeBtn {
      margin-top: 10px;
      padding: 12px 20px;
      background: #444;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

  </style>
</head>

<body>

  <h1>💰 Bitcoin Clicker</h1>

  <div id="btc">0 BTC</div>

  <button id="clickBtn">+1 BTC</button>

  <div class="upgrade">
    <h3>Auto Miner ⛏️</h3>
    <p>Cost: 50 BTC</p>
    <button class="upgradeBtn" onclick="buyAutoMiner()">Buy Miner</button>
  </div>

<script>
  let btc = 0;
  let autoMiner = 0;

  const btcDisplay = document.getElementById("btc");
  const clickBtn = document.getElementById("clickBtn");

  clickBtn.onclick = () => {
    btc++;
    updateDisplay();
  };

  function updateDisplay() {
    btcDisplay.innerText = btc + " BTC";
  }

  function buyAutoMiner() {
    if (btc >= 50) {
      btc -= 50;
      autoMiner++;
      startAutoMining();
      updateDisplay();
    } else {
      alert("Not enough BTC!");
    }
  }

  function startAutoMining() {
    setInterval(() => {
      btc += autoMiner;
      updateDisplay();
    }, 1000);
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Taskara Clicker</title>

<!-- TASKARA SDK -->
<script src="https://cdn.taskara.com/sdk/v1.js"></script>

<style>
    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(180deg, #000000, #0a0a0a);
        font-family: Arial, sans-serif;
        color: #fff;
        text-align: center;
        user-select: none;
    }

    #main {
        margin-top: 40px;
        padding: 20px;
    }

    #avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin-top: 10px;
        border: 3px solid #ffd700;
        box-shadow: 0 0 20px #ffd700;
    }

    #score {
        font-size: 60px;
        font-weight: bold;
        margin-top: 15px;
        background: linear-gradient(90deg, #ffcf33, #ffaa00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    #tapBtn {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        border: none;
        margin-top: 25px;
        background: radial-gradient(circle, #ffe066, #ff9900);
        box-shadow: 0 0 30px #ffcc00;
        font-size: 26px;
        font-weight: bold;
        color: #000;
        cursor: pointer;
        transition: 0.1s;
    }

    #tapBtn:active {
        transform: scale(0.90);
        box-shadow: 0 0 10px #ffaa00;
    }

    .infoBox {
        margin-top: 25px;
        padding: 10px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px;
        width: 260px;
        margin-left: auto;
        margin-right: auto;
    }

    #warn {
        margin-top: 40px;
        font-size: 12px;
        color: #ff4444;
        opacity: 0.8;
    }
</style>

</head>
<body>

<div id="main">
    <h1>Taskara Clicker Mini-App</h1>

    <img id="avatar" src="">

    <div class="infoBox">
        <div id="username">Loading...</div>
        <div id="userid"></div>
    </div>

    <h1 id="score">0</h1>

    <button id="tapBtn">TAP</button>

    <p id="warn">
        ⚠️ If anything suspicious is detected, your account, IP and device may be permanently banned.
    </p>
</div>

<script>
    let score = 0;

    // INIT SDK
    Taskara.init({
        appId: "tkr_live_ihunlp60at_plsy87n12f",
        callback: "https://yourapp.com/callback"
    });

    // VERIFY USER
    Taskara.getUser()
        .then(user => {
            document.getElementById("username").innerText = "@"+user.username;
            document.getElementById("userid").innerText = "User ID: "+user.userId;
            document.getElementById("avatar").src = user.avatar;
        })
        .catch(err => {
            alert("User verification failed. Cannot continue.");
            console.error(err);
        });

    // CLICK BUTTON
    document.getElementById("tapBtn").addEventListener("click", () => {
        score++;
        document.getElementById("score").innerText = score;

        // SEND TASK COMPLETION
        Taskara.completeTask({
            taskId: "click_event",
            points: 1
        });
    });
</script>

</body>
</html>
